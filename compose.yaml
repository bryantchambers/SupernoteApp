name: supernote-app

services:
  web:
    build:
      context: .
      args:
        CALIBRE_VERSION: ${CALIBRE_VERSION:-9.11.0}
        RCLONE_RELEASE: ${RCLONE_RELEASE:-1.74.4}
    image: ${SUPERNOTE_IMAGE:-supernote-app:local}
    env_file:
      - ${STATE_DIR}/config/app.env
    environment:
      SUPERNOTE_DATA_DIR: /data
      SUPERNOTE_DATABASE_PATH: /data/db.sqlite3
      SUPERNOTE_SOURCE: /data/Supernote
      SUPERNOTE_ARCHIVE_DIR: /data/ARCHIVE
      SUPERNOTE_PROCESSED_DIR: /data/PROCESSED_NOTES
      SUPERNOTE_SYNC_LOCK_FILE: /data/.sync/supernote.lock
      SUPERNOTE_ENV_FILE: /config/app.env
      SUPERNOTE_STATIC_ROOT: /static
      RCLONE_CONFIG: /config/rclone/rclone.conf
    volumes:
      - ${STATE_DIR}/data:/data
      - ${STATE_DIR}/config:/config
      - ${STATE_DIR}/backups:/backups
      - static_data:/static
    restart: unless-stopped
    init: true
    shm_size: 512m
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=1g,mode=1777
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 60s

  proxy:
    image: caddy:2.10-alpine
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-8000}:80"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - static_data:/static:ro
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  static_data:
