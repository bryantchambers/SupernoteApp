{% extends 'base.html' %}
{% load static %}
{% block content %}
<link rel="stylesheet" href="{% static 'planner/planner.css' %}">
<div id="daily-planner">
<div class="max-w-md mx-auto bg-white rounded-xl p-8 border border-slate-200">
<h1 class="text-2xl font-semibold mb-4">Sign in to your planner</h1>
<p class="text-slate-500 mb-6">Use your Supernote app account.</p>
<form class="planner-form" method="post">{% csrf_token %}{{ form.as_p }}<input type="hidden" name="next" value="{{ next }}"><button class="bg-indigo-600 text-white rounded-lg px-5 py-2 mt-4">Sign in</button></form>
</div>
</div>
{% endblock %}
