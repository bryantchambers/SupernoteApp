{% extends 'base.html' %}
{% load lucide_icons %}

{% block title %}Periodicals{% endblock %}

{% block content %}
<div class="sm:flex sm:justify-between sm:items-center mb-6">
    <div class="mb-4 sm:mb-0">
        <h1 class="text-2xl md:text-3xl text-slate-800 font-bold">{{ title }}</h1>
        <p class="text-sm text-slate-500 mt-1">Fetch news recipes, keep recent EPUB issues, and send them to Document/News.</p>
    </div>
    <form hx-post="{% url 'files:periodicals_seed' %}" hx-target="#periodicals-browser" hx-swap="innerHTML" class="flex items-center gap-2">
        {% csrf_token %}
        <button type="submit" class="inline-flex items-center gap-2 bg-slate-900 hover:bg-slate-800 text-white font-semibold py-2 px-4 rounded text-sm">
            {% icon "refresh-cw" "w-4 h-4" %}
            <span>Refresh Catalog</span>
        </button>
    </form>
</div>

<div class="mb-4 flex items-center justify-end gap-4">
    <form method="get" class="flex gap-2 max-w-xl w-full justify-end">
        <input type="search" name="q" value="{{ query }}" placeholder="Search periodicals" class="w-full rounded border border-slate-300 px-3 py-2 text-sm focus:border-indigo-500 focus:ring-indigo-500">
        <button type="submit" class="inline-flex items-center gap-2 bg-slate-900 text-white px-4 py-2 rounded text-sm">Search</button>
    </form>
</div>

<div id="periodicals-browser"
     hx-get="{% url 'files:periodicals_dashboard' %}"
     hx-trigger="periodicals-refresh-list from:body"
     hx-target="#periodicals-browser"
     hx-swap="innerHTML"
     class="transition-all duration-300">
    {% include 'files/partials/periodical_list.html' %}
</div>
{% endblock %}
