<div class="bg-white shadow-lg rounded-sm border border-slate-200">
    <header class="px-5 py-4 border-b border-slate-100 flex justify-between items-center">
        <h2 class="font-semibold text-slate-800">Recycle Bin <span class="text-slate-400 font-medium">{{ items.count }}</span></h2>
        <div class="flex items-center gap-2">
            <form hx-post="{% url 'files:zotero_empty_bin' %}" hx-target="#zotero-browser" hx-swap="innerHTML">
                {% csrf_token %}
                <button type="submit" class="inline-flex items-center gap-2 rounded bg-rose-600 px-3 py-2 text-sm font-semibold text-white hover:bg-rose-700">Empty Bin</button>
            </form>
            <span class="text-xs text-slate-500">{{ zotero_state.status|default:'idle' }}</span>
        </div>
    </header>
    <div class="p-3">
        <div class="overflow-x-auto">
            <table class="table-auto w-full">
                <thead class="text-xs font-semibold uppercase text-slate-400 bg-slate-50">
                    <tr>
                        <th class="p-2 whitespace-nowrap"><div class="font-semibold text-left">Title</div></th>
                        <th class="p-2 whitespace-nowrap"><div class="font-semibold text-left">Attachment</div></th>
                        <th class="p-2 whitespace-nowrap"><div class="font-semibold text-left">Added</div></th>
                        <th class="p-2 whitespace-nowrap"><div class="font-semibold text-left">State</div></th>
                        <th class="p-2 whitespace-nowrap"><div class="font-semibold text-center">Actions</div></th>
                    </tr>
                </thead>
                <tbody class="text-sm divide-y divide-slate-100">
                    {% for item in items %}
                        {% include 'files/partials/zotero_recycle_row.html' %}
                    {% empty %}
                    <tr>
                        <td colspan="5" class="p-8 text-center text-slate-400">Recycle bin is empty.</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
