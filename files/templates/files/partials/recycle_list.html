{% load lucide_icons %}
<div class="bg-white shadow-lg rounded-sm border border-slate-200">
    <header class="px-5 py-4 border-b border-slate-100 flex justify-between items-center">
        <h2 class="font-semibold text-slate-800">Recycle Bin <span class="text-slate-400 font-medium">{{ items.count }}</span></h2>
    </header>
    <div class="p-3">
        <div class="overflow-x-auto">
            <table class="table-auto w-full">
                <thead class="text-xs font-semibold uppercase text-slate-400 bg-slate-50">
                    <tr>
                        <th class="p-2 whitespace-nowrap"><div class="font-semibold text-left">Name</div></th>
                        <th class="p-2 whitespace-nowrap"><div class="font-semibold text-left">Original Path</div></th>
                        <th class="p-2 whitespace-nowrap"><div class="font-semibold text-left">Size</div></th>
                        <th class="p-2 whitespace-nowrap"><div class="font-semibold text-left">Recycled</div></th>
                        <th class="p-2 whitespace-nowrap"><div class="font-semibold text-center">Actions</div></th>
                    </tr>
                </thead>
                <tbody class="text-sm divide-y divide-slate-100">
                    {% for item in items %}
                        {% include 'files/partials/recycle_row.html' %}
                    {% empty %}
                    <tr>
                        <td colspan="5" class="p-8 text-center text-slate-400">No items in recycle bin.</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
