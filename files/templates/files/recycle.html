{% extends 'base.html' %}
{% load lucide_icons %}

{% block title %}Recycle Bin{% endblock %}

{% block content %}
<div class="sm:flex sm:justify-between sm:items-center mb-6">
    <div class="mb-4 sm:mb-0">
        <h1 class="text-2xl md:text-3xl text-slate-800 font-bold">{{ title }}</h1>
        <p class="text-sm text-slate-500 mt-1">Recovered items stay here until restored or emptied.</p>
    </div>
    <form hx-post="{% url 'files:empty_recycle_bin' %}" hx-target="#recycle-browser" hx-swap="innerHTML" class="flex items-center gap-2">
        {% csrf_token %}
        <input type="hidden" name="q" value="{{ query }}">
        <button type="submit" class="inline-flex items-center gap-2 bg-rose-600 hover:bg-rose-700 text-white font-semibold py-2 px-4 rounded text-sm">
            {% icon "trash-2" "w-4 h-4" %}
            Empty Bin
        </button>
    </form>
</div>

<div class="mb-4 flex items-center justify-between gap-4">
    <form method="get" class="flex gap-2 max-w-xl w-full justify-end">
        <input type="search" name="q" value="{{ query }}" placeholder="Search recycled items" class="w-full rounded border border-slate-300 px-3 py-2 text-sm focus:border-indigo-500 focus:ring-indigo-500">
        <button type="submit" class="inline-flex items-center gap-2 bg-slate-900 text-white px-4 py-2 rounded text-sm">Search</button>
    </form>
</div>

<div id="recycle-browser" hx-get="{% url 'files:recycle_bin' %}" hx-trigger="recycle-refresh-list from:body" hx-target="#recycle-browser" hx-swap="innerHTML" class="transition-all duration-300">
    {% include 'files/partials/recycle_list.html' %}
</div>
{% endblock %}
